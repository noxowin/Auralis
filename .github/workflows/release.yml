# 两种用法：
# 1. 在 Actions 页面手动运行：按 csproj 里的版本号新建 Release（标签 v版本号），编译并上传。
# 2. 在 GitHub 上手动发布 Release（标签如 v0.4.0）：编译并上传到这个 Release。
# 程序里的"检查更新"读取的就是 Release 里的 AudioShare.exe。
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: 模拟测试
        run: dotnet run --project tests/AudioShare.Sim -c Release

      - name: 确定版本标签
        id: tag
        shell: pwsh
        run: |
          $version = ([xml](Get-Content src/AudioShare.App/AudioShare.App.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          $tag = "v$version"
          if ("${{ github.event_name }}" -eq "release" -and $tag -ne "${{ github.event.release.tag_name }}") {
            throw "csproj 里的版本 $tag 和 Release 标签 ${{ github.event.release.tag_name }} 不一致"
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: 编译单文件 exe
        run: >
          dotnet publish src/AudioShare.App -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none -o publish

      - name: 打包 zip
        shell: pwsh
        run: |
          Copy-Item README.md publish/
          Compress-Archive -Path publish/AudioShare.exe, publish/README.md -DestinationPath AudioShare-${{ steps.tag.outputs.tag }}-win-x64.zip

      - name: 新建 Release（手动运行时）
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create ${{ steps.tag.outputs.tag }} --target ${{ github.sha }}
          --title "AudioShare ${{ steps.tag.outputs.tag }}" --notes-file RELEASE_NOTES.md

      - name: 上传到 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release upload ${{ steps.tag.outputs.tag }}
          publish/AudioShare.exe AudioShare-${{ steps.tag.outputs.tag }}-win-x64.zip --clobber
